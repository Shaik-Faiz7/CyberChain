<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected Document Viewer - DocSec</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
:root {
  --primary: #4361ee;
  --secondary: #3a0ca3;
  --success: #4cc9f0;
  --warning: #f72585;
  --dark: #1a1a2e;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
  user-select: none; /* Disable text selection */
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
}

body {
  background: linear-gradient(135deg, #0f0c29, #24243e, #1a1a2e);
  color: white;
  min-height: 100vh;
  overflow: hidden;
}

/* Disable all interactions */
* {
  pointer-events: auto;
  -webkit-touch-callout: none;
  -webkit-user-drag: none;
}

.nav {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.brand {
  font-size: 20px;
  font-weight: 700;
  display: flex;
  gap: 10px;
  align-items: center;
}

.protected-badge {
  background: rgba(247,37,133,0.3);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

button {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  background: rgba(255,255,255,0.2);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: rgba(255,255,255,0.3);
}

.viewer-container {
  position: relative;
  width: 100%;
  height: calc(100vh - 70px);
  overflow: hidden;
  background: #2a2a3e;
}

/* Transparent overlay to prevent direct interaction */
.protection-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 999;
  background: transparent;
  pointer-events: none;
}

#viewerFrame {
  width: 100%;
  height: 100%;
  border: none;
  pointer-events: auto;
}

#pdfCanvas {
  display: block;
  margin: 20px auto;
  max-width: 95%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}

#imageViewer {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  position: relative;
}

#imageViewer img {
  max-width: 90%;
  max-height: 90%;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  pointer-events: none;
}

.watermark {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-45deg);
  font-size: 80px;
  color: rgba(255,255,255,0.05);
  pointer-events: none;
  z-index: 1000;
  font-weight: 900;
  letter-spacing: 10px;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(26,26,46,0.95);
  padding: 15px 25px;
  border-radius: 40px;
  display: flex;
  gap: 15px;
  align-items: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  z-index: 1001;
}

.controls button {
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 8px 15px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.page-info {
  color: var(--success);
  font-weight: 600;
  font-size: 14px;
}

.warning-banner {
  background: rgba(247,37,133,0.2);
  padding: 12px 20px;
  text-align: center;
  font-size: 13px;
  color: #ff6b9d;
  border-bottom: 2px solid rgba(247,37,133,0.4);
}
</style>
</head>

<body>

<div class="nav">
  <div class="brand">
    <i class="fas fa-shield-alt"></i> 
    DOCSEC - Protected Viewer
  </div>
  <div style="display: flex; gap: 10px; align-items: center;">
    <span class="protected-badge">
      <i class="fas fa-lock"></i> READ-ONLY MODE
    </span>
    <button onclick="closeViewer()">
      <i class="fas fa-times"></i> Close
    </button>
  </div>
</div>

<div class="warning-banner">
  ⚠️ This document is protected. Copying, downloading, printing, and editing are disabled.
</div>

<div class="watermark">PROTECTED</div>

<div class="viewer-container">
  <div class="protection-overlay"></div>
  
  <canvas id="pdfCanvas" style="display:none;"></canvas>
  
  <div id="imageViewer" style="display:none;">
    <img id="imageContent" alt="Protected Document">
  </div>
  
  <iframe id="viewerFrame" style="display:none;"></iframe>
</div>

<div class="controls" id="pdfControls" style="display:none;">
  <button onclick="previousPage()">
    <i class="fas fa-chevron-left"></i> Prev
  </button>
  <span class="page-info">
    Page <span id="pageNum">1</span> / <span id="pageCount">1</span>
  </span>
  <button onclick="nextPage()">
    Next <i class="fas fa-chevron-right"></i>
  </button>
</div>

<script>
// Security: Disable all risky shortcuts and interactions
document.addEventListener('keydown', function(e) {
  // Block Ctrl+C, Ctrl+S, Ctrl+P, Ctrl+Shift+I, F12
  if (
    (e.ctrlKey && (e.key === 'c' || e.key === 'C')) ||
    (e.ctrlKey && (e.key === 's' || e.key === 'S')) ||
    (e.ctrlKey && (e.key === 'p' || e.key === 'P')) ||
    (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I')) ||
    (e.ctrlKey && e.shiftKey && (e.key === 'j' || e.key === 'J')) ||
    (e.ctrlKey && (e.key === 'u' || e.key === 'U')) ||
    e.key === 'F12' ||
    e.keyCode === 123
  ) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
});

// Disable right-click
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  return false;
});

// Disable copy
document.addEventListener('copy', function(e) {
  e.preventDefault();
  return false;
});

// Disable cut
document.addEventListener('cut', function(e) {
  e.preventDefault();
  return false;
});

// Disable drag and drop
document.addEventListener('dragstart', function(e) {
  e.preventDefault();
  return false;
});

// PDF.js setup
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let pageNum = 1;
let pageRendering = false;
let pageNumPending = null;

function renderPage(num) {
  pageRendering = true;
  pdfDoc.getPage(num).then(function(page) {
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: 1.5 });
    
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const renderContext = {
      canvasContext: ctx,
      viewport: viewport
    };

    const renderTask = page.render(renderContext);
    renderTask.promise.then(function() {
      pageRendering = false;
      if (pageNumPending !== null) {
        renderPage(pageNumPending);
        pageNumPending = null;
      }
    });
  });

  document.getElementById('pageNum').textContent = num;
}

function queueRenderPage(num) {
  if (pageRendering) {
    pageNumPending = num;
  } else {
    renderPage(num);
  }
}

function previousPage() {
  if (pageNum <= 1) return;
  pageNum--;
  queueRenderPage(pageNum);
}

function nextPage() {
  if (pageNum >= pdfDoc.numPages) return;
  pageNum++;
  queueRenderPage(pageNum);
}

function closeViewer() {
  window.history.back();
}

// Load document based on URL parameters
const urlParams = new URLSearchParams(window.location.search);
const username = urlParams.get('username');
const filename = urlParams.get('filename');

if (!username || !filename) {
  alert('Invalid document reference');
  closeViewer();
} else {
  loadProtectedDocument(username, filename);
}

async function loadProtectedDocument(username, filename) {
  try {
    const url = `http://127.0.0.1:8000/view-protected/${username}/${filename}`;
    
    // Fetch the file
    const response = await fetch(url);
    if (!response.ok) throw new Error('Failed to load document');
    
    const blob = await response.blob();
    const contentType = response.headers.get('content-type');
    
    // Handle PDF
    if (contentType.includes('pdf')) {
      const arrayBuffer = await blob.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
      
      loadingTask.promise.then(function(pdf) {
        pdfDoc = pdf;
        document.getElementById('pageCount').textContent = pdf.numPages;
        document.getElementById('pdfCanvas').style.display = 'block';
        document.getElementById('pdfControls').style.display = 'flex';
        renderPage(pageNum);
      }).catch(function(error) {
        console.error('PDF loading error:', error);
        alert('Failed to load PDF');
      });
    }
    // Handle images
    else if (contentType.includes('image')) {
      const imageUrl = URL.createObjectURL(blob);
      const imgElement = document.getElementById('imageContent');
      imgElement.src = imageUrl;
      document.getElementById('imageViewer').style.display = 'flex';
    }
    // Handle other files
    else {
      const fileUrl = URL.createObjectURL(blob);
      const iframe = document.getElementById('viewerFrame');
      iframe.src = fileUrl;
      iframe.style.display = 'block';
    }
  } catch (error) {
    console.error('Error loading document:', error);
    alert('Failed to load protected document');
    closeViewer();
  }
}

// Extra protection: clear clipboard on focus
window.addEventListener('focus', function() {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText('').catch(() => {});
  }
});

// Prevent screenshot indication (basic level)
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    console.log('Document hidden - potential screenshot attempt');
  }
});
</script>

</body>
</html>
